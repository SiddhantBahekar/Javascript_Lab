<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String & Regex Practical</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#e8e8f0,#ededeb);
}

/* Student Details */
.student{
    position:absolute;
    top:10px;
    left:10px;
    font-size:16px;
    font-weight:bold;
    color:rgb(5, 5, 5);
}

.container{
    width:480px;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    color:rgb(142, 161, 73);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input,textarea{
    width:100%;
    margin:10px 0;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

textarea{
    resize:none;
    height:120px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00c6ff;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0096c7;
}

#result{
    margin-top:20px;
    background:rgba(255,255,255,.15);
    padding:15px;
    border-radius:10px;
    line-height:1.8;
}
</style>
</head>

<body>

<!-- Student Details -->
<div class="student">
    Name: Siddhant Bahekar <br>
    PRN: 24070521077
</div>

<div class="container">

<h2>📧 String & Regex Analyzer</h2>

<input type="text" id="email" placeholder="Enter Email Address">

<textarea id="text" placeholder="Enter any text with numbers..."></textarea>

<button onclick="analyzeText()">Analyze</button>

<div id="result">
Results will appear here.
</div>

</div>

<script>

function analyzeText(){

    let email = document.getElementById("email").value.trim();
    let text = document.getElementById("text").value.trim();

    // Regular Expression for Email Validation
    let emailPattern = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

    let emailStatus = emailPattern.test(email)
        ? "✅ Valid Email"
        : "❌ Invalid Email";

    // String Functions
    let upper = text.toUpperCase();
    let lower = text.toLowerCase();
    let characters = text.length;
    let words = text === "" ? 0 : text.split(/\s+/).length;

    // Data Extraction using Regex
    let numbers = text.match(/\d+/g);

    document.getElementById("result").innerHTML =
    "<b>Email Validation:</b> " + emailStatus + "<br><br>" +
    "<b>Total Characters:</b> " + characters + "<br>" +
    "<b>Total Words:</b> " + words + "<br><br>" +
    "<b>Uppercase:</b><br>" + upper + "<br><br>" +
    "<b>Lowercase:</b><br>" + lower + "<br><br>" +
    "<b>Extracted Numbers:</b> " +
    (numbers ? numbers.join(", ") : "No Numbers Found");
}

</script>

</body>
</html>
