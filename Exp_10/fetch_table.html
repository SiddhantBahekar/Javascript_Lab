<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Data Viewer</title>

<!-- jQuery CDN -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#43cea2,#185a9d);
    min-height:100vh;
    padding:40px;
}

/* Student Details */
.student{
    position:absolute;
    top:10px;
    left:10px;
    font-size:16px;
    font-weight:bold;
    color:rgb(22, 21, 21);
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#185a9d;
    margin-bottom:20px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.fetchBtn{
    background:#27ae60;
}

.jqueryBtn{
    background:#2980b9;
}

button:hover{
    opacity:0.9;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#185a9d;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

tr:nth-child(even){
    background:#f4f4f4;
}

tr:hover{
    background:#eaf4ff;
}
</style>
</head>

<body>

<!-- Student Details -->
<div class="student">
    Name: Siddhant Bahekar <br>
    PRN: 24070521077
</div>

<div class="container">

<h2>📋 JSON Data Viewer</h2>

<div class="buttons">
<button class="fetchBtn" onclick="loadFetchData()">
Load using fetch()
</button>

<button class="jqueryBtn" onclick="loadJQueryData()">
Load using $.getJSON()
</button>
</div>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>City</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

</div>

<script>

function displayData(users){

    let output = "";

    users.forEach(user => {

        output += `
        <tr>
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.address.city}</td>
        </tr>
        `;

    });

    document.getElementById("tableBody").innerHTML = output;
}

// Using fetch()
function loadFetchData(){

    fetch("https://jsonplaceholder.typicode.com/users")
    .then(response => response.json())
    .then(data => displayData(data))
    .catch(error => alert("Error : " + error));

}

// Using jQuery $.getJSON()
function loadJQueryData(){

    $.getJSON(
        "https://jsonplaceholder.typicode.com/users",
        function(data){
            displayData(data);
        }
    );

}

</script>

</body>
</html>
