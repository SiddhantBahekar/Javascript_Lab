<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grading System & Validation</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        .error { color: red; font-size: 0.9em; display: block; margin-top: 5px; }
        .result { margin-top: 20px; font-weight: bold; font-size: 1.2em; color: green; }
    </style>
</head>
<body>

    <h2>Student Grading System</h2>
    
    <form id="gradeForm" novalidate>
        <div class="form-group">
            <label for="studentName">Student Name:</label><br>
            <input type="text" id="studentName" placeholder="Enter student name">
            <span id="nameError" class="error"></span>
        </div>

        <div class="form-group">
            <label for="marks">Marks obtained (0 - 100):</label><br>
            <input type="number" id="marks" placeholder="Enter marks">
            <span id="marksError" class="error"></span>
        </div>

        <button type="submit">Calculate Grade</button>
    </form>

    <div id="resultOutput" class="result"></div>

    <script>
        document.getElementById('gradeForm').addEventListener('submit', function(event) {
            // Prevent the default form submission behavior (page reload)
            event.preventDefault();

            // 1. Fetch input values and clear previous messages
            const nameInput = document.getElementById('studentName').value.trim();
            const marksInput = document.getElementById('marks').value.trim();
            
            const nameError = document.getElementById('nameError');
            const marksError = document.getElementById('marksError');
            const resultOutput = document.getElementById('resultOutput');

            nameError.textContent = "";
            marksError.textContent = "";
            resultOutput.textContent = "";

            let isValid = true;

            // 2. Form Validation (Presence & Range Checks)
            if (nameInput === "") {
                nameError.textContent = "Student name is required.";
                isValid = false;
            }

            if (marksInput === "") {
                marksError.textContent = "Marks field cannot be empty.";
                isValid = false;
            } else {
                // Convert string input to a floating-point number
                const marks = parseFloat(marksInput);

                if (isNaN(marks)) {
                    marksError.textContent = "Please enter a valid numeric value.";
                    isValid = false;
                } else if (marks < 0 || marks > 100) {
                    marksError.textContent = "Marks must be between 0 and 100.";
                    isValid = false;
                }
            }

            // Stop execution if validation fails
            if (!isValid) return;

            // 3. Control Structures (Conditional logic to determine grade)
            const marks = parseFloat(marksInput);
            let grade = "";

            if (marks >= 90) {
                grade = "A+ (Excellent)";
            } else if (marks >= 80) {
                grade = "A (Very Good)";
            } else if (marks >= 70) {
                grade = "B (Good)";
            } else if (marks >= 60) {
                grade = "C (Satisfactory)";
            } else if (marks >= 50) {
                grade = "D (Pass)";
            } else {
                grade = "F (Fail)";
            }

            // 4. Output the result dynamically
            resultOutput.textContent = `${nameInput} received a grade of: ${grade}`;
        });
    </script>

</body>
</html>
